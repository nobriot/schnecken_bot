[package]
name = "lichess"
version = "0.0.1"
authors = ["Nicolas Woltmann"]
description = "Lichess API wrapper"
license = "MIT"
keywords = ["lichess", "lichess-api"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
reqwest = { version = "0.13.5", features = ["blocking", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
log = { version = "0.4.34", features = ["std", "serde"] }
tokio = { version = "1.54.0", features = ["time"] }
serde_json = "1.0.154"
urlencoding = "2"
futures-util = "0.3.34"

[lib]
name = "lichess"
path = "lib.rs"
crate-type = ["lib"]
required-features = []
